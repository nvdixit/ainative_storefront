<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Toolchain</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        color: #111827;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        padding: 28px;
        width: min(900px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 24px;
        color: #4b5563;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .node {
        fill: #2563eb;
        stroke: #1d4ed8;
        stroke-width: 2;
      }

      .node.child {
        fill: #7c3aed;
        stroke: #6d28d9;
      }

      .node-label {
        fill: white;
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .subtle {
        fill: #64748b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Agent Toolchain Flow</h1>
      <p>Starting point and the two available tool branches.</p>
      <svg viewBox="0 0 800 400" role="img" aria-label="Flowchart showing load_products branching to add_order and add_favorite_product">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path>
          </marker>
        </defs>

        <line x1="400" y1="0" x2="400" y2="40" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"></line>
        <line x1="360" y1="120" x2="260" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"></line>
        <line x1="440" y1="120" x2="540" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"></line>

        <rect class="node" x="280" y="40" width="240" height="80" rx="20"></rect>
        <text class="node-label" x="400" y="80">load_products</text>

        <rect class="node child" x="80" y="280" width="240" height="80" rx="20"></rect>
        <text class="node-label" x="200" y="320">add_order</text>

        <rect class="node child" x="480" y="280" width="240" height="80" rx="20"></rect>
        <text class="node-label" x="600" y="320">add_favorite_product</text>

        <text class="subtle" x="215" y="190" text-anchor="middle">order: ORDER_SCHEMA</text>
        <text class="subtle" x="580" y="190" text-anchor="middle">product_ids: list[String]</text>
      </svg>
    </div>
  </body>
</html>
